<div id="fog-edge-review">
  <div class="viz-controls">
    <button type="button" class="btn" data-action="start">起点</button>
    <button type="button" class="btn btn-primary" data-action="play">播放一次渐变</button>
    <button type="button" class="btn" data-action="end">终点</button>
    <label class="form-label" for="fog-edge-progress">移动过渡 <output id="fog-edge-value">0%</output>
      <input id="fog-edge-progress" class="form-range" type="range" min="0" max="100" value="0">
    </label>
  </div>
  <div class="fog-comparison">
    <section>
      <h3>0 · 硬边对照</h3>
      <canvas width="640" height="384" data-mode="control" role="img" aria-label="硬边逐格遮罩对照"></canvas>
    </section>
    <section>
      <h3>A · 8px 短羽化</h3>
      <canvas width="640" height="384" data-mode="feather" role="img" aria-label="四周留白，边界向内羽化"></canvas>
    </section>
    <section>
      <h3>B · 不规则雾边</h3>
      <canvas width="640" height="384" data-mode="organic" role="img" aria-label="不规则轮廓，保留四周全透明"></canvas>
    </section>
    <section>
      <h3>C · 相邻融合</h3>
      <canvas width="640" height="384" data-mode="merged" role="img" aria-label="覆盖区域融合，放宽逐格透明留边"></canvas>
    </section>
  </div>
  <div class="text-small" aria-live="polite" data-status>50 / 60 / 70 / 80% · C 放宽逐格透明留边 · 地面素材合成，非实机</div>
</div>
<style>
  #fog-edge-review { display: grid; gap: calc(var(--font-size-base) * 0.75); color: var(--foreground); }
  #fog-edge-review .fog-comparison { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: calc(var(--font-size-base) * 0.75); }
  #fog-edge-review section { display: grid; gap: calc(var(--font-size-base) * 0.25); min-width: 0; }
  #fog-edge-review canvas { display: block; width: 100%; height: auto; }
  @media (max-width: 520px) { #fog-edge-review .fog-comparison { grid-template-columns: 1fr; } }
</style>
<script type="application/json" id="fog-edge-data">__FOG_DATA__</script>
<script>
(() => {
  const root = document.getElementById("fog-edge-review");
  const data = JSON.parse(document.getElementById("fog-edge-data").textContent);
  const slider = root.querySelector("#fog-edge-progress");
  const output = root.querySelector("#fog-edge-value");
  const canvases = Array.from(root.querySelectorAll("canvas[data-mode]"));
  const status = root.querySelector("[data-status]");
  const cache = {};
  let ground;
  let animation = 0;
  let ready = false;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const savedState = window.openai?.widgetState?.modelContent;
  let progress = Number.isFinite(savedState?.progress) ? Math.min(1, Math.max(0, savedState.progress)) : 0;
  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = source;
    });
  }
  function imagePixels(image) {
    const surface = document.createElement("canvas");
    surface.width = data.width;
    surface.height = data.height;
    const context = surface.getContext("2d", {willReadFrequently: true});
    context.drawImage(image, 0, 0);
    return context.getImageData(0, 0, data.width, data.height);
  }
  function save() {
    window.openai?.setWidgetState?.({modelContent: {progress}, privateContent: null})?.catch(() => {});
  }
  function draw(value) {
    progress = value;
    slider.value = String(Math.round(value * 100));
    output.textContent = `${Math.round(value * 100)}%`;
    if (!ready) return;
    for (const canvas of canvases) {
      const mode = cache[canvas.dataset.mode];
      const context = canvas.getContext("2d", {willReadFrequently: true});
      context.clearRect(0, 0, data.width, data.height);
      context.drawImage(ground, 0, 0);
      const target = mode.image.data;
      for (let offset = 3; offset < target.length; offset += 4) {
        target[offset] = Math.round(mode.start.data[offset] * (1 - value) + mode.end.data[offset] * value);
      }
      mode.context.putImageData(mode.image, 0, 0);
      context.drawImage(mode.surface, 0, 0);
    }
  }
  slider.addEventListener("input", () => {
    cancelAnimationFrame(animation);
    draw(Number(slider.value) / 100);
  });
  slider.addEventListener("change", save);
  root.querySelector('[data-action="start"]').addEventListener("click", () => {
    cancelAnimationFrame(animation);
    draw(0);
    save();
  });
  root.querySelector('[data-action="end"]').addEventListener("click", () => {
    cancelAnimationFrame(animation);
    draw(1);
    save();
  });
  root.querySelector('[data-action="play"]').addEventListener("click", () => {
    cancelAnimationFrame(animation);
    draw(0);
    if (reducedMotion) { draw(1); save(); return; }
    const started = performance.now();
    function frame(now) {
      const elapsed = Math.min(1, (now - started) / 250);
      draw((1 - Math.cos(Math.PI * elapsed)) / 2);
      if (elapsed < 1) animation = requestAnimationFrame(frame);
      else save();
    }
    animation = requestAnimationFrame(frame);
  });
  window.addEventListener("openai:set_globals", event => {
    const state = event.detail?.globals?.widgetState?.modelContent;
    if (Number.isFinite(state?.progress)) {
      cancelAnimationFrame(animation);
      draw(Math.min(1, Math.max(0, state.progress)));
    }
  });
  async function initialize() {
    ground = await loadImage(data.ground);
    for (const [name, sources] of Object.entries(data.fields)) {
      const [start, end] = await Promise.all([loadImage(sources.start), loadImage(sources.end)]);
      const surface = document.createElement("canvas");
      surface.width = data.width;
      surface.height = data.height;
      const first = imagePixels(start);
      cache[name] = {
        start: first, end: imagePixels(end), image: imagePixels(start),
        surface, context: surface.getContext("2d")
      };
    }
    ready = true;
    draw(progress);
  }
  initialize().catch(() => { status.textContent = "预览加载失败，请查看静态对比图。"; });
})();
</script>
